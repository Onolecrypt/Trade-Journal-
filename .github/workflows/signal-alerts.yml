# Save this file in your repository at:  .github/workflows/signal-alerts.yml
#
# It checks the scanner rules once an hour on weekdays and sends a Telegram message when a live signal appears.
# For the intraday style (15 minute entries) change the schedule line to:  - cron: '3,18,33,48 * * * 1-5'
# Times are UTC. GitHub can start scheduled runs a few minutes late, which is fine.
name: Signal alerts

on:
  schedule:
    - cron: '3 * * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Only send a test message'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the markets
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_BALANCE: ${{ secrets.ALERT_BALANCE }}
          ALERT_RISK_PCT: ${{ secrets.ALERT_RISK_PCT }}
        run: node alert-scan.js ${{ inputs.test && '--test' || '' }}
      - name: Remember what was already sent
        run: |
          git config user.name "signal-alerts"
          git config user.email "signal-alerts@users.noreply.github.com"
          git add alert-state.json
          git diff --staged --quiet || (git commit -m "alerts: remember sent signals" && git push)
